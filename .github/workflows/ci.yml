name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      TESTING: "True"
      DEBUG: "False"
      DEBUG_ENDPOINTS: "False"
      DISABLE_STARTUP_NETWORK: "True"
      OPEN_BROWSER: "False"
      RATE_LIMIT_ENABLED: "False"
      REQUIRE_MUTATION_TOKEN: "False"
      SOCKETIO_ASYNC_MODE: threading
      STOCKSENSE_DB_PATH: .dev-runtime/ci-nexus.db
      STOCKSENSE_MARKET_DB_PATH: .dev-runtime/ci-market.db
      STOCKSENSE_ADAPTIVE_DB_PATH: .dev-runtime/ci-adaptive.db
      STOCKSENSE_AUDIT_LOG_PATH: .dev-runtime/ci-audit.jsonl
      TRUST_PROXY_HEADERS: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff syntax lint
        run: python -m ruff check app.py backend tests scripts
      - name: Type check baseline
        run: python -m mypy app.py backend scripts
        continue-on-error: true
      - name: Compile Python
        run: python -m compileall -q app.py backend scripts
      - name: Run backend tests with coverage
        run: python -m pytest --cov=backend --cov=app --cov=scripts --cov-report=term-missing -q
      - name: Run SQLite integration tests
        run: python -m pytest tests/integration/db -q
      - name: Dependency security audit
        run: python -m pip_audit
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit/component tests
        run: npm run test
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Playwright smoke tests
        run: npm run test:e2e
