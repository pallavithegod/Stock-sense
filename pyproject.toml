[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksense-nexus"
version = "0.11.0"
description = "Local/demo stock intelligence dashboard with Flask, React, and SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.1",
  "alpha-vantage==3.0.0",
  "beautifulsoup4==4.15.0",
  "cachetools==7.1.4",
  "feedparser==6.0.12",
  "finnhub-python==2.4.29",
  "Flask==3.1.3",
  "flask-cors==6.0.5",
  "Flask-SocketIO==5.6.1",
  "gunicorn==26.0.0",
  "httpx==0.28.1",
  "joblib==1.5.3",
  "loguru==0.7.3",
  "lxml==6.1.1",
  "numpy==2.4.6",
  "orjson==3.11.9",
  "pandas==3.0.3",
  "plotly==6.9.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "pytz==2026.2",
  "RapidFuzz==3.14.5",
  "requests==2.34.2",
  "schedule==1.2.2",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "SQLAlchemy==2.0.51",
  "statsmodels==0.14.6",
  "tenacity==9.1.4",
  "tzdata==2026.3",
  "vaderSentiment==3.3.2",
  "yfinance==1.5.1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets==1.5.0",
  "mypy==1.14.1",
  "pip-audit==2.7.3",
  "pre-commit==4.0.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
]
ml = [
  "lime==0.2.0.1",
  "matplotlib==3.11.1",
  "newsapi-python==0.2.7",
  "nltk==3.10.0",
  "psutil==7.2.2",
  "sentence-transformers==5.6.0",
  "shap==0.52.0",
  "ta==0.11.0",
  "tensorflow==2.21.0",
  "textblob==0.20.1",
  "torch==2.13.0",
  "transformers==5.14.1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app", "backend", "scripts"]
omit = [
  "tests/*",
]

[tool.coverage.report]
fail_under = 20
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  ".pytest-runtime",
  ".dev-runtime",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
warn_unused_configs = true
no_implicit_optional = true
exclude = [
  "backend/legacy/",
  ".venv/",
  ".pytest-runtime/",
  ".dev-runtime/",
]
