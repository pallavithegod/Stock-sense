[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksense"
version = "0.11.0"
description = "Local/demo stock intelligence dashboard with Flask, React, and SQLite."
readme = "README.md"
requires-python = ">=3.11"
# Direct runtime dependencies. beautifulsoup4, numpy, pytz and tzdata are kept
# pinned because yfinance and pandas require them.
dependencies = [
  "beautifulsoup4==4.15.0",
  "Flask==3.1.3",
  "flask-cors==6.0.5",
  "Flask-SocketIO==5.6.1",
  "gunicorn==26.0.0",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "pytz==2026.2",
  "requests==2.34.2",
  "tzdata==2026.3",
  "yfinance==1.5.1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets==1.5.0",
  "mypy==1.14.1",
  "pip-audit==2.7.3",
  "pre-commit==4.0.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra"
cache_dir = ".pytest-runtime/pytest-cache"

[tool.coverage.run]
branch = true
source = ["app", "backend", "scripts"]
omit = [
  "tests/*",
]

[tool.coverage.report]
fail_under = 20
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  ".pytest-runtime",
  ".dev-runtime",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
warn_unused_configs = true
no_implicit_optional = true
exclude = [
  "backend/legacy/",
  ".venv/",
  ".pytest-runtime/",
  ".dev-runtime/",
]
